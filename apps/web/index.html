<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Signalfire</title>
  <meta name="description" content="Attention tokens on NEAR whose trading fees can only fund marketing campaigns chosen by holders. Testnet only." />
  <meta name="theme-color" content="#fff8f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17110c" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Geist:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    // apply a saved light/dark choice before the first paint (no flash); "system" or nothing follows the OS
    try { var t = localStorage.getItem('signalfire:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
