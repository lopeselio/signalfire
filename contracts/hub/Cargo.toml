[package]
name = "signalfire-hub"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Signalfire: attention-token launchpad, bonding-curve market, spend-restricted marketing treasuries, sealed-bid campaign auctions, agent wallets, NEP-171 receipts."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.5-rust-1.85.1"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
hex = "0.4"
bs58 = "0.5.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
ed25519-dalek = "2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
